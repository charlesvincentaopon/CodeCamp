<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <main>
    <h1>Multimedia Player</h1>
    <section>
      <h2>Title of the Song Playing</h2>
      <audio controls aria-label="sailing away">
        <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3"
        type="mp3">
      </audio>
      
    </section>
    <section>
      <h2>Title of the Video Playing</h2>
      <video controls width="400" aria-label="video">
        <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
        <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" 
        srclang="en"
        label="English"
        kind="subtitles">
      </video>
    </section>
    <section>
      <h2>Transcript</h2>
      <p>This was the transcript of the video</p>

    </section>
    
  </main>

</body>

</html>
